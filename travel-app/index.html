<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wanderlust Finder 🌍</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="app-container">
        
        <div id="welcome-screen" class="screen active">
            <h1>Find Your Next Getaway ✈️</h1>
            <p>Tell us what you're craving, and we'll find the perfect, affordable destination for you.</p>
            <button id="start-btn" class="primary-btn">Start the Quiz 🌴</button>
        </div>

        <div id="quiz-screen" class="screen">
            <div class="progress-bar-container"><div id="progress-bar"></div></div>
            <h2 id="question-text" class="animate-pop">Loading...</h2>
            <div id="options-container" class="options-grid"></div>
        </div>

        <div id="results-screen" class="screen">
            <h2>🎉 Your Perfect Match! 🎉</h2>
            <div id="destination-card" class="card animate-slide-up">
                <img id="dest-image" src="" alt="Destination Photo">
                <div class="card-content">
                    <h3 id="dest-name">Destination Name</h3>
                    <div class="tags">
                        <span id="dest-budget" class="tag"></span>
                        <span id="dest-vibe" class="tag"></span>
                    </div>
                    <p id="dest-desc">Description goes here.</p>
                </div>
            </div>
            <button id="restart-btn" class="primary-btn outline">Plan Another Trip 🔄</button>
        </div>

    </div>
    <script src="app.js"></script>
</body>
</html>
